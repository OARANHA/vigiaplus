name: vigiaplus

services:
  traefik:
    image: traefik:v3.1
    container_name: vigiaplus-traefik
    command:
      - "--configFile=/etc/traefik/traefik.yml"
      # ACME (Let's Encrypt) configurado via flags para evitar interpolação de env.
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-certs:/letsencrypt
    networks:
      - vnet
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: vigiaplus-app
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      APP_URL: ${APP_URL:-https://${APP_DOMAIN}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-VigiaPlus}
      NEXT_PUBLIC_BRAND_BYLINE: ${NEXT_PUBLIC_BRAND_BYLINE:-Monitoramento multi-tenant}
      # Cobrança: Stripe (cartão) + Asaas/Pix (BR)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api.asaas.com}
      ASAAS_WEBHOOK_AUTH_TOKEN: ${ASAAS_WEBHOOK_AUTH_TOKEN:-}
      PIX_WEBHOOK_SECRET: ${PIX_WEBHOOK_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      RADAR_MCP_TOKEN: ${RADAR_MCP_TOKEN:-}
      DEMO_MODE: ${DEMO_MODE:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vigiaplus.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.vigiaplus.entrypoints=websecure"
      - "traefik.http.routers.vigiaplus.tls.certresolver=letsencrypt"
      - "traefik.http.routers.vigiaplus.middlewares=secure-headers@file"
      - "traefik.http.services.vigiaplus.loadbalancer.server.port=3000"
    volumes:
      - vigiaplus-data:/app/.data
    networks:
      - vnet
    restart: unless-stopped
    depends_on:
      - traefik

volumes:
  traefik-certs:
  vigiaplus-data:

networks:
  vnet:
    driver: bridge
