# Compose de FUNDAÇÃO (H0). Sobe hoje: Traefik + web + postgres + redis.
# Os workers/scheduler aparecem COMENTADOS porque ainda não existem (H0/H4).
# Não é honesto declarar contêineres que não executam nada.
#
# Uso local:
#   docker compose -f deploy/docker-compose.yml up --build
#   curl -k https://vigiaplus.localhost/health
#
# Antes de produção: trocar domínios, ACME_EMAIL, senhas e segredos; revisar
# o gate AGPL em NOTICE.md.

services:
  traefik:
    image: traefik:v3.2
    container_name: vigia_traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certs:/letsencrypt
    networks:
      - vigiaplus_net
    labels:
      - "traefik.enable=true"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: vigia_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET}
      CREDENTIALS_ENC_KEY_V1: ${CREDENTIALS_ENC_KEY_V1:?defina CREDENTIALS_ENC_KEY_V1}
      VIGIA_WEBHOOK_SECRET: ${VIGIA_WEBHOOK_SECRET:?defina VIGIA_WEBHOOK_SECRET}
      DATABASE_URL: postgres://vigiaplus:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/vigiaplus
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vigiaplus_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`vigiaplus.localhost`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=vigia-chain@file"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
      # Separação de superfícies na borda: o console pode exigir allowlist de IP.
      # - "traefik.http.routers.console.rule=Host(`console.vigiaplus.localhost`) && PathPrefix(`/api/console`)"
      # - "traefik.http.routers.console.middlewares=admin-ipallowlist@file"

  postgres:
    image: postgres:16-alpine
    container_name: vigia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vigiaplus
      POSTGRES_USER: vigiaplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigiaplus -d vigiaplus"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vigiaplus_net

  redis:
    image: redis:7-alpine
    container_name: vigia_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vigiaplus_net

  # ---- H0/H4: ainda NÃO implementados -----------------------------------
  # scheduler:
  #   build: { context: .., dockerfile: deploy/Dockerfile }
  #   command: ["node", "src/workers/scheduler.js"]   # H0 E0.8
  # worker-ingest:
  #   command: ["node", "src/workers/ingest.js"]      # H4 E4.1
  # worker-ai:
  #   command: ["node", "src/workers/ai.js"]          # H4 E4.1
  # worker-notify:
  #   command: ["node", "src/workers/notify.js"]      # H2 E2.6

networks:
  vigiaplus_net:
    name: vigiaplus_net
    driver: bridge

volumes:
  pg_data:
  redis_data:
  traefik_certs:
