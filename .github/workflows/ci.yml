name: CI

on:
  push:
    branches:
      - main
      - feat/todo-alt08-notify-supervisor-20261111
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: node --import tsx --test tests/*.test.ts

      - name: Build
        run: npm run build
